# УДАЛЁННЫЙ РЕЖИМ С ВНЕШНИМ MTProto-БЭКЕНДОМ
# Для сетей, где прямой доступ к Telegram закрыт и официальный MTProxy не работает,
# но уже есть рабочий MTProto-прокси с секретом (например, tg-ws-proxy).
#
#   главный NPM ─https─▶ :18443 gateway ─▶ relay ─▶ 127.0.0.1:2398 forward ─▶ ваш MTProto-прокси
#
# Relay ходит только на loopback, поэтому до вашего прокси байты доносит socat.
# Секрет в config/profiles.json должен совпадать с секретом вашего прокси
# (обычный 32 hex или dd + 32 hex; ee… relay не поддерживает).
#
# Запуск: docker compose -f docker-compose.remote-ext.yml up -d --build

services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-18443}:8443"
    environment:
      NPM_IP: ${NPM_IP:?укажите NPM_IP в .env}
    volumes:
      - ./remote/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./remote/certs:/etc/nginx/certs:ro
      - ./site/html:/usr/share/nginx/html:ro
    # Доступ к прокси, слушающему на самом хосте (network_mode: host или опубликованный порт):
    #   BACKEND_ADDR=host.docker.internal:<порт>
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - backend

  forward:
    image: alpine/socat:1.8.0.1
    network_mode: "service:gateway"
    restart: unless-stopped
    command:
      - "TCP-LISTEN:2398,bind=127.0.0.1,reuseaddr,fork"
      - "TCP:${BACKEND_ADDR:?укажите BACKEND_ADDR в .env (хост:порт MTProto-прокси)}"
    depends_on: [gateway]

  relay:
    build:
      context: ./relay
      args:
        TPROXY_REF: ${TPROXY_REF:-master}
    network_mode: "service:gateway"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./config:/config:ro
    depends_on: [gateway, forward]

networks:
  # docker-сеть, в которой живёт ваш MTProto-прокси, чтобы обращаться к нему по имени
  # контейнера (BACKEND_ADDR=tg-proxy-backend:<порт>). Узнать имя сети:
  #   docker inspect tg-proxy-backend --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
  # Если прокси в сети хоста (network_mode: host), укажите любую существующую
  # пользовательскую сеть или удалите `backend` здесь и в gateway.networks.
  backend:
    external: true
    name: ${BACKEND_NETWORK:?укажите BACKEND_NETWORK в .env}
