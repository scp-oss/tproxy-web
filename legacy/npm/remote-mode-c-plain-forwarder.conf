# ГЛАВНЫЙ NPM → прокси на ДРУГОМ сервере. РЕЖИМ C: NPM и сервер с прокси в
# ОДНОЙ локальной сети (например, NPM у провайдера хостинга — в том же ЦОДе/
# VLAN, что и ваш сервер). Проще режимов A/B: TLS-леги между NPM и сервером
# вообще нет — NPM идёт plain HTTP прямо на форвардер cover (19443), минуя
# Caddy полностью. Caddy на сервере с прокси в этом случае не нужен вообще
# (можно не поднимать сервис caddy из docker-compose.remote-cf-caddy.yml).
#
# Проверено живьём 2026-11-02/03 (две независимые установки): первая попытка
# сделать это через Caddy (NPM -> https://<LAN-IP>:<WEB_PUBLIC_PORT>,
# proxy_ssl_verify off) ловила 502 Bad Gateway — локально с самого NPM-хоста
# curl до сервера работал, а из самого nginx-процесса NPM — нет (либо NPM в
# докере со своим сетевым неймспейсом, либо провайдер режет это на своей
# стороне). Прямой путь на cover (без Caddy/TLS-леги) эту прослойку убирает
# полностью и просто работает.
#
# NPM → Proxy Hosts → Add:
#   Details:  Domain = proxy.example.ru, Scheme http, Forward 192.168.1.10 : 19443
#             Websockets Support = ON, Block Common Exploits = OFF, Cache Assets = OFF
#   SSL:      Let's Encrypt, Force SSL = ON, HTTP/2 Support = ON
#   Advanced: вставить всё ниже, заменив 192.168.1.10 на LAN-IP сервера с прокси.
#
# ВАЖНО при смене WEB_PUBLIC_PORT/FORWARDER_PORT на сервере с прокси: порт
# здесь ОБЯЗАТЕЛЬНО обновить синхронно (а не только в .env того сервера) —
# иначе получите тот же 502, только по другой причине (NPM целится в порт,
# который там уже никто не слушает — поймано живьём при переезде
# WEB_PUBLIC_PORT, забыли обновить этот блок).

location / {
    proxy_pass http://192.168.1.10:19443;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    set $tp_connection "";
    if ($http_upgrade) {
        set $tp_connection "upgrade";
    }
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $tp_connection;

    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 4m;
    access_log off;
}
