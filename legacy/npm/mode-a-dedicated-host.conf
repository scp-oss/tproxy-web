# РЕЖИМ A — отдельный (под)домен только под прокси, например proxy.example.com.
# Весь хост идёт через relay, relay сам отдаёт сайт-прикрытие.
#
# NPM → Hosts → Proxy Hosts → Add:
#   Details:  Domain = proxy.example.com, Scheme http, Forward 127.0.0.1 : 18080
#             Websockets Support = ON, Block Common Exploits = OFF, Cache Assets = OFF
#   SSL:      Let's Encrypt, Force SSL = ON, HTTP/2 Support = ON, HSTS по желанию
#   Advanced: вставить всё ниже целиком.
#
# Блок `location /` в Advanced заменяет стандартный location NPM. Это нужно,
# потому что стандартный ставит X-Forwarded-For списком ($proxy_add_x_forwarded_for),
# а relay принимает ровно один адрес и отвергает список.

location / {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket-режимы (websocket / websocket-lanes)
    set $tp_connection "";
    if ($http_upgrade) {
        set $tp_connection "upgrade";
    }
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $tp_connection;

    # long poll relay = 25 с; батчи до 2 МиБ
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 4m;

    # URL моста содержит производный от секрета токен — не писать в логи
    access_log off;
}
