# ГЛАВНЫЙ NPM → прокси на ДРУГОМ сервере. РЕЖИМ A: весь (под)домен под прокси.
# Подходит, если на этом имени сейчас нет ничего важного в вебе.
# Прикрытие показывает relay (site/html или вариант 2 в remote/nginx.conf.template).
#
# NPM → Proxy Hosts → Add:
#   Details:  Domain = mail.example.ru, Scheme https, Forward 192.168.1.10 : 18443
#             Websockets Support = ON, Block Common Exploits = OFF, Cache Assets = OFF
#   SSL:      Let's Encrypt, Force SSL = ON, HTTP/2 Support = ON
#   Advanced: всё ниже, заменив 192.168.1.10 на IP сервера с прокси.

location / {
    proxy_pass https://192.168.1.10:18443;
    proxy_http_version 1.1;
    proxy_ssl_verify off;            # у gateway самоподписанный сертификат

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # ровно один адрес
    proxy_set_header X-Forwarded-Proto $scheme;

    set $tp_connection "";
    if ($http_upgrade) {
        set $tp_connection "upgrade";
    }
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $tp_connection;

    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 4m;
    access_log off;
}
