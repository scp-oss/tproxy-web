# РЕЖИМ B — прокси «внутри» уже работающего в NPM сайта, например example.com.
# Сайт обслуживается как раньше; в relay уходит только префикс /<base_path>/.
#
# Открыть существующий Proxy Host сайта → Advanced → добавить блок ниже,
# заменив phcf2vfe7zgbrslg на ваш base path (config/base_path).
# Details/SSL сайта не трогать; HTTP/2 Support должен быть ON.
#
# И обязательно: в site/nginx.conf включите ВАРИАНТ 2 (proxy_pass на тот же
# контейнер сайта), чтобы запросы под префиксом без секрета получали
# родную 404 сайта, а не чужую. См. BASE_PATH.md апстрима, раздел Mode B.
#
# ^~ не даёт regex-локациям NPM (Cache Assets и т. п.) перехватить префикс.

location ^~ /phcf2vfe7zgbrslg/ {
    proxy_pass http://127.0.0.1:18080;   # без URI-части: префикс уходит как есть
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    set $tp_connection "";
    if ($http_upgrade) {
        set $tp_connection "upgrade";
    }
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $tp_connection;

    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 4m;

    access_log off;
}
