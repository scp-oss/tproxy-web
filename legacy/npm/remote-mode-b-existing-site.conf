# ГЛАВНЫЙ NPM → прокси на ДРУГОМ сервере. РЕЖИМ B: на домене уже есть настоящий
# сайт / веб-почта (например, mail.example.ru), он остаётся как есть.
# На второй сервер уходит только секретный префикс /<base_path>/.
#
# Открыть существующий Proxy Host этого домена → Advanced → добавить блок ниже:
#   phcf2vfe7zgbrslg → ваш base path (config/base_path на сервере с прокси)
#   192.168.1.10    → IP сервера с прокси
# HTTP/2 Support в SSL — ON.
#
# На сервере с прокси в remote/nginx.conf.template включите ВАРИАНТ 2 и укажите
# origin той же веб-почты: тогда запрос под префиксом без секрета получит
# родную 404 сайта, а не чужую.

location ^~ /phcf2vfe7zgbrslg/ {
    proxy_pass https://192.168.1.10:18443;   # без URI-части: префикс уходит как есть
    proxy_http_version 1.1;
    proxy_ssl_verify off;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    set $tp_connection "";
    if ($http_upgrade) {
        set $tp_connection "upgrade";
    }
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $tp_connection;

    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 4m;
    access_log off;
}
