<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — NodeSentry</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --bg:#0f1419; --panel:#161c24; --border:#2a333f; --text:#d6e0ea; --text-dim:#7c8a9a; --accent:#3b9dff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; }
  .box h1 { font-size: 64px; color: var(--text-dim); margin-bottom: 8px; }
  .box p { color: var(--text-dim); margin-bottom: 20px; }
  .box a { color: var(--accent); text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>Страница не найдена</p>
    <a href="/">← Вернуться к панели</a>
  </div>
</body>
</html>
