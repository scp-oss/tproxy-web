# Сайт-прикрытие. Его видит всякий, кто зайдёт на хост без правильного секрета.
# Слушает только loopback внутри сетевого пространства NPM.

server {
    listen 127.0.0.1:13000;
    server_name _;
    server_tokens off;

    # ВАРИАНТ 1 (по умолчанию): статичный сайт из ./site/html
    # Нужны минимум index.html и 404.html. Контент — свой и уникальный.
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }

    # ВАРИАНТ 2: прикрытием служит уже работающий сайт в другом контейнере
    # (WordPress, ваш FastAPI и т. п.), к которому NPM уже ходит по docker-сети.
    # Закомментируйте блок выше и раскомментируйте этот:
    #
    # resolver 127.0.0.11 valid=30s;
    # set $site http://my-site-container:80;
    # location / {
    #     proxy_pass $site;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto https;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $http_connection;
    # }
}
